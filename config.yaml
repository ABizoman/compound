# Trading Bot Configuration

# LLM Configuration
llm:
  provider: "openrouter"  # Options: openrouter, openai, etc.
  model: "minimax/minimax-m2"  # Better at following instructions than grok
  # Alternative free models: google/gemini-flash-1.5, microsoft/phi-3-medium-128k-instruct:free
  api_base: "https://openrouter.ai/api/v1"  # API base URL
  # API key should be in .env file as OPENROUTER_API_KEY

# Trading Parameters
trading:
  initial_capital: 5000.0  # Starting capital in USD
  max_steps_per_day: 25  # Maximum LLM tool-call iterations per day
  symbols:  # List of symbols to trade, chosen as s&p 500 top 20 stocks in dec 2024 (info got from perplexity)
    - "NVDA"
    - "MSFT"
    - "AAPL"
    - "GOOG"
    - "GOOGL"
    - "AMZN"
    - "META"
    - "AVGO"
    - "TSLA"
    - "NFLX"
    - "BRK.B"
    - "LLY"
    - "JPM"
    - "XOM"
    - "JNJ"
    - "UNH"
    - "V"
    - "PG"
    - "HD"
    - "MA"


# Data Storage
data:
  base_dir: "./data"
  

